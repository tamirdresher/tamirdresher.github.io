name: Scheduled Pages rebuild

on:
  workflow_dispatch:
  schedule:
    # 08:17 Asia/Jerusalem on the November 2026 publication dates.
    - cron: '17 6 * * *'

permissions:
  pages: write

jobs:
  request-build:
    if: github.repository == 'tamirdresher/tamirdresher.github.io' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Required in _config.yml: future: false (Pages defaults differ from Jekyll).
      - name: Request the existing legacy Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/pages/builds"
