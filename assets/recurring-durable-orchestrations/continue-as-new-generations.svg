<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" role="img" aria-labelledby="generations-title generations-desc">
  <title id="generations-title">ContinueAsNew separates recurring work into bounded logical generations</title>
  <desc id="generations-desc">A two-row conceptual comparison. The top row, without ContinueAsNew, shows four cycle boxes inside one increasingly dark warm-colored execution history. The bottom row, with ContinueAsNew, shows four separate green generation boxes connected by arrows labeled compact checkpoint. A label states that the logical instance ID remains the same. The figure illustrates generation boundaries, not physical storage deletion. External event preservation depends on SDK options.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172b4d; }
      .title { font-size: 28px; font-weight: 700; fill: #102a43; }
      .subtitle { font-size: 16px; fill: #475569; }
      .section { font-size: 19px; font-weight: 700; fill: #102a43; }
      .box-title { font-size: 16px; font-weight: 700; }
      .box-body { font-size: 14px; }
      .label { font-size: 14px; font-weight: 700; fill: #475569; }
      .small { font-size: 13px; fill: #475569; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2.5; }
    </style>
    <marker id="generation-arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="760" height="600" fill="#f8fafc"/>
  <text x="32" y="48" class="title">One recurring process, two history shapes</text>
  <text x="32" y="78" class="subtitle">The code can repeat without keeping every cycle in one generation.</text>

  <g aria-label="Without ContinueAsNew, cycles accumulate in one execution history">
    <rect x="32" y="104" width="696" height="184" rx="12" class="panel"/>
    <text x="52" y="136" class="section">Without ContinueAsNew</text>
    <text x="52" y="160" class="small">One execution keeps the durable actions from earlier cycles.</text>

    <rect x="52" y="180" width="150" height="62" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="127" y="207" text-anchor="middle" class="box-title">Cycle 1</text>
    <text x="127" y="229" text-anchor="middle" class="box-body">history retained</text>

    <rect x="220" y="180" width="150" height="62" rx="8" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
    <text x="295" y="207" text-anchor="middle" class="box-title">Cycle 2</text>
    <text x="295" y="229" text-anchor="middle" class="box-body">more appended</text>

    <rect x="388" y="180" width="150" height="62" rx="8" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/>
    <text x="463" y="207" text-anchor="middle" class="box-title">Cycle 3</text>
    <text x="463" y="229" text-anchor="middle" class="box-body">more appended</text>

    <rect x="556" y="180" width="150" height="62" rx="8" fill="#fb923c" stroke="#9a3412" stroke-width="1.5"/>
    <text x="631" y="207" text-anchor="middle" class="box-title">Cycle 4</text>
    <text x="631" y="229" text-anchor="middle" class="box-body">history still grows</text>

    <path d="M 72 262 H 686" class="arrow" marker-end="url(#generation-arrow)"/>
    <text x="379" y="281" text-anchor="middle" class="label">one growing logical execution history</text>
  </g>

  <g aria-label="With ContinueAsNew, each cycle has a fresh logical generation">
    <rect x="32" y="312" width="696" height="222" rx="12" class="panel"/>
    <text x="52" y="344" class="section">With ContinueAsNew</text>
    <text x="52" y="368" class="small">Same logical instance ID; each generation starts with selected compact state.</text>

    <rect x="52" y="394" width="140" height="74" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="122" y="423" text-anchor="middle" class="box-title">Generation 1</text>
    <text x="122" y="448" text-anchor="middle" class="box-body">bounded history</text>

    <path d="M 194 431 H 216" class="arrow" marker-end="url(#generation-arrow)"/>
    <text x="205" y="488" text-anchor="middle" class="small">checkpoint</text>

    <rect x="220" y="394" width="140" height="74" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="290" y="423" text-anchor="middle" class="box-title">Generation 2</text>
    <text x="290" y="448" text-anchor="middle" class="box-body">bounded history</text>

    <path d="M 362 431 H 384" class="arrow" marker-end="url(#generation-arrow)"/>
    <text x="373" y="488" text-anchor="middle" class="small">checkpoint</text>

    <rect x="388" y="394" width="140" height="74" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="458" y="423" text-anchor="middle" class="box-title">Generation 3</text>
    <text x="458" y="448" text-anchor="middle" class="box-body">bounded history</text>

    <path d="M 530 431 H 552" class="arrow" marker-end="url(#generation-arrow)"/>
    <text x="541" y="488" text-anchor="middle" class="small">checkpoint</text>

    <rect x="556" y="394" width="150" height="74" rx="8" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
    <text x="631" y="423" text-anchor="middle" class="box-title">Generation 4</text>
    <text x="631" y="448" text-anchor="middle" class="box-body">bounded history</text>

    <text x="379" y="516" text-anchor="middle" class="label">fresh logical history, compact required state passed forward</text>
  </g>

  <text x="32" y="566" class="small">Illustrative generation boundaries, not physical storage deletion.</text>
  <text x="32" y="588" class="small">Buffered external-event preservation depends on the SDK option described below.</text>
</svg>
