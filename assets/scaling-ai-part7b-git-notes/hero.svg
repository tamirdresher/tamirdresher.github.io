<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d1f35"/>
      <stop offset="100%" stop-color="#060a10"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Stars -->
  <g fill="#4a6fa5" opacity="0.4">
    <circle cx="80" cy="50" r="1.2"/><circle cx="210" cy="30" r="0.8"/><circle cx="350" cy="80" r="1"/>
    <circle cx="500" cy="20" r="1.5"/><circle cx="650" cy="55" r="0.7"/><circle cx="800" cy="35" r="1.2"/>
    <circle cx="950" cy="70" r="0.9"/><circle cx="1100" cy="25" r="1.1"/><circle cx="1150" cy="90" r="0.6"/>
    <circle cx="150" cy="580" r="1"/><circle cx="400" cy="600" r="0.8"/><circle cx="700" cy="590" r="1.3"/>
    <circle cx="1000" cy="570" r="0.9"/><circle cx="1100" cy="595" r="1.1"/><circle cx="60" cy="320" r="0.8"/>
    <circle cx="1140" cy="280" r="1"/><circle cx="30" cy="480" r="1.2"/><circle cx="1170" cy="450" r="0.7"/>
  </g>

  <!-- ===== BORG CUBE (center-left) ===== -->
  <!-- Cube body - dark metallic -->
  <g transform="translate(240,200)">
    <!-- Back faces (darker) -->
    <polygon points="0,60 80,0 160,60 80,120" fill="#0e2010" stroke="#1a4a20" stroke-width="1.5"/>
    <polygon points="80,0 160,60 160,160 80,100" fill="#091808" stroke="#1a4a20" stroke-width="1.5"/>

    <!-- Front faces -->
    <polygon points="0,60 80,120 80,220 0,160" fill="#112514" stroke="#22aa44" stroke-width="2"/>
    <polygon points="80,120 160,160 160,260 80,220" fill="#0e2010" stroke="#22aa44" stroke-width="2"/>
    <polygon points="0,160 80,220 160,260 80,200 0,160" fill="#152e18" stroke="#22aa44" stroke-width="2"/>

    <!-- Borg grid lines on front face -->
    <line x1="25" y1="90" x2="60" y2="165" stroke="#33cc55" stroke-width="0.8" opacity="0.6"/>
    <line x1="50" y1="80" x2="75" y2="175" stroke="#33cc55" stroke-width="0.8" opacity="0.6"/>
    <line x1="15" y1="120" x2="75" y2="185" stroke="#33cc55" stroke-width="0.8" opacity="0.5"/>
    <line x1="5" y1="150" x2="70" y2="200" stroke="#33cc55" stroke-width="0.8" opacity="0.4"/>

    <!-- Borg green glow accent -->
    <ellipse cx="40" cy="160" rx="35" ry="8" fill="#22aa44" opacity="0.15" filter="url(#softglow)"/>
  </g>

  <!-- ===== FUNNY BORG SIGN (speech bubble from cube) ===== -->
  <g transform="translate(360, 145)">
    <rect x="0" y="0" width="310" height="75" rx="10" fill="#0d2010" stroke="#33cc55" stroke-width="1.5"/>
    <!-- Tail pointing to cube -->
    <polygon points="0,30 -18,50 15,50" fill="#0d2010" stroke="#33cc55" stroke-width="1.5"/>
    <text x="16" y="25" font-family="'Courier New',monospace" font-size="13" fill="#33cc55" font-weight="bold">RESISTANCE IS FUTILE.</text>
    <text x="16" y="44" font-family="'Courier New',monospace" font-size="12" fill="#66ee88">We have added your commit history</text>
    <text x="16" y="62" font-family="'Courier New',monospace" font-size="12" fill="#66ee88">to our <tspan fill="#ffdd55">refs/notes/squad/*</tspan> collective.</text>
  </g>

  <!-- ===== GIT COMMIT NODES (right side) ===== -->
  <!-- Commit 1 - gets assimilated with note -->
  <g transform="translate(750, 120)">
    <circle r="28" fill="#0a1628" stroke="#4a90d9" stroke-width="2" filter="url(#glow)"/>
    <text y="-8" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#88bbff">commit</text>
    <text y="6" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#88bbff">a3f7c2</text>
    <!-- Sticky note attached -->
    <g transform="translate(22,-35)">
      <rect x="0" y="0" width="90" height="52" rx="3" fill="#ffee88" stroke="#ccbb44" stroke-width="1.2"/>
      <text x="6" y="14" font-family="'Courier New',monospace" font-size="9" fill="#333">squad/decisions:</text>
      <text x="6" y="26" font-family="'Courier New',monospace" font-size="8.5" fill="#555">"Use JWT, RS256.</text>
      <text x="6" y="37" font-family="'Courier New',monospace" font-size="8.5" fill="#555"> existing pattern"</text>
      <text x="6" y="48" font-family="'Courier New',monospace" font-size="7.5" fill="#888">— agent:Data</text>
    </g>
  </g>

  <!-- Commit 2 -->
  <g transform="translate(870, 290)">
    <circle r="28" fill="#0a1628" stroke="#4a90d9" stroke-width="2" filter="url(#glow)"/>
    <text y="-8" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#88bbff">commit</text>
    <text y="6" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#88bbff">b9e1f4</text>
    <!-- Sticky note -->
    <g transform="translate(24,-40)">
      <rect x="0" y="0" width="95" height="52" rx="3" fill="#ffee88" stroke="#ccbb44" stroke-width="1.2"/>
      <text x="6" y="14" font-family="'Courier New',monospace" font-size="9" fill="#333">squad/worf:</text>
      <text x="6" y="26" font-family="'Courier New',monospace" font-size="8.5" fill="#555">"security review:</text>
      <text x="6" y="37" font-family="'Courier New',monospace" font-size="8.5" fill="#555"> approved ✓"</text>
      <text x="6" y="48" font-family="'Courier New',monospace" font-size="7.5" fill="#888">— agent:Worf</text>
    </g>
  </g>

  <!-- Commit 3 - rejected, greyed out -->
  <g transform="translate(720, 440)" opacity="0.45">
    <circle r="28" fill="#0a1628" stroke="#666" stroke-width="2" stroke-dasharray="5,3"/>
    <text y="-8" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#666">commit</text>
    <text y="6" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#666">d2c8a1</text>
    <text y="50" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#cc4444">(PR rejected)</text>
    <!-- Note also greyed out -->
    <g transform="translate(22,-38)">
      <rect x="0" y="0" width="95" height="42" rx="3" fill="#eeeecc" stroke="#999977" stroke-width="1"/>
      <text x="6" y="14" font-family="'Courier New',monospace" font-size="8.5" fill="#888">"Use HS256 instead"</text>
      <text x="6" y="26" font-family="'Courier New',monospace" font-size="8.5" fill="#888">↳ unreachable.</text>
      <text x="6" y="37" font-family="'Courier New',monospace" font-size="7.5" fill="#aaa">auto-withdrawn ✗</text>
    </g>
  </g>

  <!-- Assimilation beams from cube to commits -->
  <line x1="430" y1="320" x2="722" y2="150" stroke="#33cc55" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.7" filter="url(#glow)"/>
  <line x1="430" y1="340" x2="842" y2="295" stroke="#33cc55" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.7" filter="url(#glow)"/>
  <line x1="430" y1="360" x2="695" y2="430" stroke="#555" stroke-width="1" stroke-dasharray="4,6" opacity="0.4"/>

  <!-- ===== ORPHAN BRANCH (bottom) ===== -->
  <g transform="translate(240, 520)">
    <rect width="380" height="50" rx="8" fill="#0d0d25" stroke="#6644cc" stroke-width="1.5"/>
    <text x="14" y="18" font-family="'Courier New',monospace" font-size="11" fill="#9977ff" font-weight="bold">refs/heads/squad/state  (orphan branch)</text>
    <text x="14" y="36" font-family="'Courier New',monospace" font-size="10" fill="#7755cc">decisions.md · agent-histories/ · routing.md</text>
  </g>

  <!-- Vertical sync line from cube to orphan branch -->
  <line x1="350" y1="440" x2="350" y2="518" stroke="#6644cc" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.7"/>
  <text x="358" y="490" font-family="Arial,sans-serif" font-size="10" fill="#9977ff" opacity="0.8">ralph-watch promotes notes → decisions.md</text>

  <!-- ===== TITLE (top) ===== -->
  <text x="600" y="55" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="bold" fill="#ffffff" opacity="0.95">The Invisible Layer</text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#88aacc">Git Notes · Orphan Branches · Squad State Without PR Pollution</text>
  <line x1="380" y1="95" x2="820" y2="95" stroke="#2244aa" stroke-width="1" opacity="0.5"/>

  <!-- ===== SERIES LABEL ===== -->
  <text x="600" y="608" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#445577">Scaling AI-Native Software Engineering — Part 7b</text>
</svg>
