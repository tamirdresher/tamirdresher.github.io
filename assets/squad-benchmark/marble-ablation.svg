<svg width="100%" height="380" viewBox="0 0 780 380" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
    <!-- Y axis -->
    <line x1="160" y1="30" x2="160" y2="290" stroke="#dedede" stroke-width="1"/>
    <!-- Y labels -->
    <text x="155" y="35" text-anchor="end" font-size="10" fill="#5c5c5c">100%</text>
    <text x="155" y="100" text-anchor="end" font-size="10" fill="#5c5c5c">75%</text>
    <text x="155" y="165" text-anchor="end" font-size="10" fill="#5c5c5c">50%</text>
    <text x="155" y="230" text-anchor="end" font-size="10" fill="#5c5c5c">25%</text>
    <text x="155" y="293" text-anchor="end" font-size="10" fill="#5c5c5c">0%</text>
    <!-- Grid lines -->
    <line x1="160" y1="30" x2="750" y2="30" stroke="#dedede" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="160" y1="95" x2="750" y2="95" stroke="#dedede" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="160" y1="160" x2="750" y2="160" stroke="#dedede" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="160" y1="225" x2="750" y2="225" stroke="#dedede" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="160" y1="290" x2="750" y2="290" stroke="#dedede" stroke-width="1"/>

    <!-- Domain: Coding (x=180) -->
    <!-- Full Squad: 100% → bar from 290 to 30, height=260 -->
    <rect x="180" y="30" width="28" height="260" fill="#b11f4b" rx="3"/>
    <!-- Coord-only: 100% -->
    <rect x="212" y="30" width="28" height="260" fill="#b11f4b" rx="3" opacity="0.65"/>
    <!-- Memory-only: 40% → 290-104=186 -->
    <rect x="244" y="186" width="28" height="104" fill="#f59e0b" rx="3"/>
    <!-- No-squad: 90% → 290-234=56 -->
    <rect x="276" y="56" width="28" height="234" fill="#0078d4" rx="3"/>
    <text x="243" y="308" text-anchor="middle" font-size="11" fill="#5c5c5c">Coding</text>

    <!-- Domain: Research (x=340) -->
    <!-- Full Squad: 100% -->
    <rect x="340" y="30" width="28" height="260" fill="#b11f4b" rx="3"/>
    <!-- Coord-only: 90% → 290-234=56 -->
    <rect x="372" y="56" width="28" height="234" fill="#b11f4b" rx="3" opacity="0.65"/>
    <!-- Memory-only: 70% → 290-182=108 -->
    <rect x="404" y="108" width="28" height="182" fill="#f59e0b" rx="3"/>
    <!-- No-squad: 80% → 290-208=82 -->
    <rect x="436" y="82" width="28" height="208" fill="#0078d4" rx="3"/>
    <text x="403" y="308" text-anchor="middle" font-size="11" fill="#5c5c5c">Research</text>

    <!-- Domain: Bargaining (x=500) -->
    <!-- Full Squad: 100% -->
    <rect x="500" y="30" width="28" height="260" fill="#b11f4b" rx="3"/>
    <!-- Coord-only: 90% -->
    <rect x="532" y="56" width="28" height="234" fill="#b11f4b" rx="3" opacity="0.65"/>
    <!-- Memory-only: 60% → 290-156=134 -->
    <rect x="564" y="134" width="28" height="156" fill="#f59e0b" rx="3"/>
    <!-- No-squad: 70% → 290-182=108 -->
    <rect x="596" y="108" width="28" height="182" fill="#0078d4" rx="3"/>
    <text x="563" y="308" text-anchor="middle" font-size="11" fill="#5c5c5c">Bargaining</text>

    <!-- Domain: Database (x=660) -->
    <!-- Full Squad: 100% -->
    <rect x="650" y="30" width="28" height="260" fill="#b11f4b" rx="3"/>
    <!-- Coord-only: 90% -->
    <rect x="682" y="56" width="28" height="234" fill="#b11f4b" rx="3" opacity="0.65"/>
    <!-- Memory-only: 0% (all timed out / no output) -->
    <rect x="714" y="289" width="28" height="1" fill="#f59e0b" rx="3"/>
    <!-- No-squad: 100% (verified re-run — all 10 produced output) -->
    <rect x="746" y="30" width="28" height="260" fill="#0078d4" rx="3"/>
    <text x="712" y="308" text-anchor="middle" font-size="11" fill="#5c5c5c">Database</text>

    <!-- Legend inside SVG -->
    <rect x="180" y="335" width="14" height="14" fill="#b11f4b" rx="2"/>
    <text x="198" y="347" font-size="10" fill="#5c5c5c">Full Squad (100%)</text>
    <rect x="310" y="335" width="14" height="14" fill="#b11f4b" rx="2" opacity="0.65"/>
    <text x="328" y="347" font-size="10" fill="#5c5c5c">Coord-only (92.5%)</text>
    <rect x="460" y="335" width="14" height="14" fill="#f59e0b" rx="2"/>
    <text x="478" y="347" font-size="10" fill="#5c5c5c">Memory-only (42.5%)</text>
    <rect x="620" y="335" width="14" height="14" fill="#0078d4" rx="2"/>
    <text x="638" y="347" font-size="10" fill="#5c5c5c">No Squad (85%)</text>
  </svg>

