<svg width="100%" height="170" viewBox="0 0 700 170" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
    <!-- Full Squad -->
    <rect x="160" y="15" width="243" height="28" fill="#b11f4b" rx="4"/>
    <text x="150" y="33" text-anchor="end" font-size="11" fill="#5c5c5c">Full Squad</text>
    <text x="410" y="33" font-size="11" font-weight="600" fill="#242424">$0.97/task</text>
    <text x="500" y="33" font-size="10" fill="#16a34a">99.25% task completion</text>

    <!-- Coord-only -->
    <rect x="160" y="55" width="103" height="28" fill="#b11f4b" rx="4" opacity="0.65"/>
    <text x="150" y="73" text-anchor="end" font-size="11" fill="#5c5c5c">Coord-only</text>
    <text x="270" y="73" font-size="11" font-weight="600" fill="#242424">$0.41/task</text>
    <text x="360" y="73" font-size="10" fill="#16a34a">92.5% completion</text>

    <!-- No Squad -->
    <rect x="160" y="95" width="170" height="28" fill="#0078d4" rx="4"/>
    <text x="150" y="113" text-anchor="end" font-size="11" fill="#5c5c5c">No Squad</text>
    <text x="337" y="113" font-size="11" font-weight="600" fill="#242424">$0.68/task</text>
    <text x="427" y="113" font-size="10" fill="#16a34a">85% completion</text>

    <!-- Note -->
    <text x="160" y="150" font-size="10" fill="#6f6f6f">Coord-only: best efficiency — 92.5% completion at lowest cost ($0.41/task).</text>
    <text x="160" y="163" font-size="10" fill="#6f6f6f">Full Squad: 1.4× cost for near-guaranteed completion (+15pp over baseline).</text>
  </svg>

