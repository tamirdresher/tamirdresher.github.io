<svg width="100%" height="470" viewBox="0 0 1000 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Controlled Squad-on versus Squad-off benchmark comparison</title>
  <desc id="desc">Grouped bar chart comparing Copilot CLI plus Squad against Copilot CLI standalone on the same model, same task IDs, and same metric across MARBLE, TerminalBench, and SWE-bench Verified.</desc>
  <rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>

  <!-- Group headers -->
  <text x="250" y="24" text-anchor="middle" font-size="11" font-weight="600" fill="#5c5c5c">MARBLE (Claude Opus 4.6)</text>
  <text x="550" y="24" text-anchor="middle" font-size="11" font-weight="600" fill="#5c5c5c">TerminalBench (n=20, directional)</text>
  <text x="780" y="24" text-anchor="middle" font-size="11" font-weight="600" fill="#5c5c5c">SWE-bench Verified (n=50, gpt-5.5)</text>

  <!-- Y axis -->
  <line x1="90" y1="60" x2="90" y2="300" stroke="#dedede" stroke-width="1"/>
  <text x="85" y="65" text-anchor="end" font-size="10" fill="#5c5c5c">100%</text>
  <text x="85" y="125" text-anchor="end" font-size="10" fill="#5c5c5c">75%</text>
  <text x="85" y="185" text-anchor="end" font-size="10" fill="#5c5c5c">50%</text>
  <text x="85" y="245" text-anchor="end" font-size="10" fill="#5c5c5c">25%</text>
  <text x="85" y="303" text-anchor="end" font-size="10" fill="#5c5c5c">0%</text>

  <!-- Grid -->
  <line x1="90" y1="60" x2="960" y2="60" stroke="#dedede" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="90" y1="120" x2="960" y2="120" stroke="#dedede" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="90" y1="180" x2="960" y2="180" stroke="#dedede" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="90" y1="240" x2="960" y2="240" stroke="#dedede" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="90" y1="300" x2="960" y2="300" stroke="#dedede" stroke-width="1"/>

  <!-- MARBLE: Completion -->
  <rect x="130" y="60" width="28" height="240" fill="#b11f4b" rx="3"/>
  <text x="144" y="54" text-anchor="middle" font-size="9" font-weight="600" fill="#b11f4b">100%</text>
  <rect x="162" y="96" width="28" height="204" fill="#0078d4" rx="3"/>
  <text x="176" y="90" text-anchor="middle" font-size="9" font-weight="600" fill="#0078d4">85%</text>
  <text x="160" y="318" text-anchor="middle" font-size="10" fill="#5c5c5c">Completion</text>

  <!-- MARBLE: Milestone-KPI -->
  <rect x="220" y="105.36" width="28" height="194.64" fill="#b11f4b" rx="3"/>
  <text x="234" y="99" text-anchor="middle" font-size="9" font-weight="600" fill="#b11f4b">81.1%</text>
  <rect x="252" y="114.72" width="28" height="185.28" fill="#0078d4" rx="3"/>
  <text x="266" y="108" text-anchor="middle" font-size="9" font-weight="600" fill="#0078d4">77.2%</text>
  <text x="250" y="318" text-anchor="middle" font-size="10" fill="#5c5c5c">Milestone-KPI</text>

  <!-- MARBLE: Quality scaled x20 -->
  <rect x="310" y="103.2" width="28" height="196.8" fill="#b11f4b" rx="3"/>
  <text x="324" y="97" text-anchor="middle" font-size="9" font-weight="600" fill="#b11f4b">4.10/5</text>
  <rect x="342" y="119.52" width="28" height="180.48" fill="#0078d4" rx="3"/>
  <text x="356" y="113" text-anchor="middle" font-size="9" font-weight="600" fill="#0078d4">3.76/5</text>
  <text x="340" y="318" text-anchor="middle" font-size="10" fill="#5c5c5c">Quality ×20</text>

  <!-- TerminalBench -->
  <rect x="520" y="108" width="28" height="192" fill="#b11f4b" rx="3"/>
  <text x="534" y="102" text-anchor="middle" font-size="9" font-weight="600" fill="#b11f4b">80%</text>
  <rect x="552" y="120" width="28" height="180" fill="#0078d4" rx="3"/>
  <text x="566" y="114" text-anchor="middle" font-size="9" font-weight="600" fill="#0078d4">75%</text>
  <text x="550" y="318" text-anchor="middle" font-size="10" fill="#5c5c5c">Resolution</text>

  <!-- SWE-bench Verified -->
  <rect x="750" y="127.2" width="28" height="172.8" fill="#b11f4b" rx="3"/>
  <text x="764" y="121" text-anchor="middle" font-size="9" font-weight="600" fill="#b11f4b">72%</text>
  <rect x="782" y="127.2" width="28" height="172.8" fill="#0078d4" rx="3"/>
  <text x="796" y="121" text-anchor="middle" font-size="9" font-weight="600" fill="#0078d4">72%</text>
  <text x="780" y="318" text-anchor="middle" font-size="10" fill="#5c5c5c">Resolution pass@1</text>
  <text x="780" y="334" text-anchor="middle" font-size="9" font-weight="700" fill="#5c5c5c">TIE (36 vs 36)</text>

  <!-- Legend -->
  <rect x="130" y="340" width="14" height="14" fill="#b11f4b" rx="2"/>
  <text x="148" y="352" font-size="10" fill="#5c5c5c">Copilot CLI + Squad</text>
  <rect x="320" y="340" width="14" height="14" fill="#0078d4" rx="2"/>
  <text x="338" y="352" font-size="10" fill="#5c5c5c">Copilot CLI standalone (same model)</text>

  <!-- Footnotes -->
  <text x="90" y="375" font-size="8.5" fill="#6f6f6f">All bars are controlled Squad-on vs Squad-off pairs: same model, same task IDs, same metric.</text>
  <text x="90" y="388" font-size="8.5" fill="#6f6f6f">SWE-bench Verified: 50 instances, gpt-5.5, matched WSL/Docker harness, test-diffs stripped. 36 vs 36 is an honest tie (±1 at n=50); each arm uniquely resolves 3 non-overlapping instances.</text>
  <text x="90" y="401" font-size="8.5" fill="#6f6f6f">Quality bars scaled ×20 to share the axis; labels show the raw 1–5 rubric score. TerminalBench n=20, different harness paths — directional only.</text>

  <!-- Caption -->
  <text x="90" y="435" font-size="9" fill="#5c5c5c">The only apples-to-apples figure: model, tasks, and metric held constant. Squad's edge concentrates on multi-agent collaboration (MARBLE); on atomic solo bug-fixing (SWE-bench Verified) the arms tie.</text>
</svg>