<svg width="100%" height="220" viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
    <!-- Copilot CLI base layer -->
    <rect x="50" y="160" width="700" height="48" rx="8" fill="#0078d4" opacity="0.12" stroke="#0078d4" stroke-width="1.5"/>
    <text x="400" y="189" text-anchor="middle" font-size="13" font-weight="600" fill="#0078d4">GitHub Copilot CLI — Agentic Harness (tools, context, model routing)</text>

    <!-- Squad layer -->
    <rect x="50" y="10" width="700" height="135" rx="8" fill="#b11f4b" opacity="0.06" stroke="#b11f4b" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="75" y="30" font-size="10" font-weight="600" fill="#b11f4b">SQUAD COORDINATION LAYER</text>

    <!-- Coordinator -->
    <rect x="310" y="40" width="180" height="38" rx="6" fill="#b11f4b" opacity="0.9"/>
    <text x="400" y="64" text-anchor="middle" font-size="12" font-weight="600" fill="white">🏗️ Coordinator</text>

    <!-- Specialist agents -->
    <rect x="80" y="95" width="120" height="34" rx="6" fill="#b11f4b" opacity="0.7"/>
    <text x="140" y="116" text-anchor="middle" font-size="11" fill="white">🔧 Backend</text>

    <rect x="220" y="95" width="120" height="34" rx="6" fill="#b11f4b" opacity="0.7"/>
    <text x="280" y="116" text-anchor="middle" font-size="11" fill="white">⚛️ Frontend</text>

    <rect x="360" y="95" width="120" height="34" rx="6" fill="#b11f4b" opacity="0.7"/>
    <text x="420" y="116" text-anchor="middle" font-size="11" fill="white">🧪 Tester</text>

    <rect x="500" y="95" width="120" height="34" rx="6" fill="#b11f4b" opacity="0.7"/>
    <text x="560" y="116" text-anchor="middle" font-size="11" fill="white">📋 Scribe</text>

    <rect x="640" y="95" width="100" height="34" rx="6" fill="#b11f4b" opacity="0.7"/>
    <text x="690" y="116" text-anchor="middle" font-size="11" fill="white">🧠 Memory</text>

    <!-- Arrows from coordinator to agents -->
    <line x1="340" y1="78" x2="140" y2="95" stroke="#b11f4b" stroke-width="1" opacity="0.5"/>
    <line x1="370" y1="78" x2="280" y2="95" stroke="#b11f4b" stroke-width="1" opacity="0.5"/>
    <line x1="430" y1="78" x2="420" y2="95" stroke="#b11f4b" stroke-width="1" opacity="0.5"/>
    <line x1="460" y1="78" x2="560" y2="95" stroke="#b11f4b" stroke-width="1" opacity="0.5"/>
    <line x1="480" y1="78" x2="690" y2="95" stroke="#b11f4b" stroke-width="1" opacity="0.5"/>

    <!-- Arrow from squad to harness -->
    <line x1="400" y1="145" x2="400" y2="160" stroke="#5c5c5c" stroke-width="1.5" marker-end="url(#arrow)"/>
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5c5c5c"/></marker></defs>
  </svg>

