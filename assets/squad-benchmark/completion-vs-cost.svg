<svg width="100%" height="360" viewBox="0 0 780 360" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
    <!-- Axes -->
    <line x1="100" y1="20" x2="100" y2="280" stroke="#dedede" stroke-width="1"/>
    <line x1="100" y1="280" x2="720" y2="280" stroke="#dedede" stroke-width="1"/>
    <!-- Y axis label -->
    <text x="25" y="150" text-anchor="middle" font-size="11" fill="#5c5c5c" transform="rotate(-90, 25, 150)">Completion Rate (%)</text>
    <!-- X axis label -->
    <text x="410" y="318" text-anchor="middle" font-size="11" fill="#5c5c5c">Cost per Task ($)</text>

    <!-- Y grid + labels: 0%, 25%, 50%, 75%, 100% -->
    <text x="95" y="284" text-anchor="end" font-size="9" fill="#5c5c5c">0%</text>
    <text x="95" y="219" text-anchor="end" font-size="9" fill="#5c5c5c">25%</text>
    <line x1="100" y1="215" x2="720" y2="215" stroke="#dedede" stroke-width="0.5" stroke-dasharray="3,3"/>
    <text x="95" y="154" text-anchor="end" font-size="9" fill="#5c5c5c">50%</text>
    <line x1="100" y1="150" x2="720" y2="150" stroke="#dedede" stroke-width="0.5" stroke-dasharray="3,3"/>
    <text x="95" y="89" text-anchor="end" font-size="9" fill="#5c5c5c">75%</text>
    <line x1="100" y1="85" x2="720" y2="85" stroke="#dedede" stroke-width="0.5" stroke-dasharray="3,3"/>
    <text x="95" y="24" text-anchor="end" font-size="9" fill="#5c5c5c">100%</text>
    <line x1="100" y1="20" x2="720" y2="20" stroke="#dedede" stroke-width="0.5" stroke-dasharray="3,3"/>

    <!-- X grid + labels: $0, $1, $2, $3, $4 -->
    <text x="100" y="298" text-anchor="middle" font-size="9" fill="#5c5c5c">$0</text>
    <text x="255" y="298" text-anchor="middle" font-size="9" fill="#5c5c5c">$1</text>
    <line x1="255" y1="20" x2="255" y2="280" stroke="#dedede" stroke-width="0.5" stroke-dasharray="3,3"/>
    <text x="410" y="298" text-anchor="middle" font-size="9" fill="#5c5c5c">$2</text>
    <line x1="410" y1="20" x2="410" y2="280" stroke="#dedede" stroke-width="0.5" stroke-dasharray="3,3"/>
    <text x="565" y="298" text-anchor="middle" font-size="9" fill="#5c5c5c">$3</text>
    <line x1="565" y1="20" x2="565" y2="280" stroke="#dedede" stroke-width="0.5" stroke-dasharray="3,3"/>
    <text x="720" y="298" text-anchor="middle" font-size="9" fill="#5c5c5c">$4</text>

    <!-- Variance ellipses (±1σ) -->
    <!-- No-Squad: cost=$0.68, rate=85%, σ=11.2% → x=205, y=63 -->
    <ellipse cx="205" cy="63" rx="25" ry="29" fill="#0078d4" opacity="0.1" stroke="#0078d4" stroke-width="1" stroke-dasharray="4,2"/>
    <circle cx="205" cy="63" r="7" fill="#0078d4"/>
    <text x="205" y="107" text-anchor="middle" font-size="9" font-weight="600" fill="#0078d4">No Squad</text>
    <text x="205" y="119" text-anchor="middle" font-size="8" fill="#0078d4">85% · $0.68</text>

    <!-- Coord-only: cost=$0.41, rate=92.5%, σ=4.3% → x=163, y=39 -->
    <ellipse cx="163" cy="39" rx="20" ry="6" fill="#b11f4b" opacity="0.1" stroke="#b11f4b" stroke-width="1" stroke-dasharray="4,2"/>
    <circle cx="163" cy="39" r="7" fill="#b11f4b" opacity="0.65"/>
    <text x="195" y="35" font-size="9" font-weight="600" fill="#b11f4b">Coord-only</text>
    <text x="195" y="47" font-size="8" fill="#b11f4b">92.5% · $0.41</text>

    <!-- Full Squad: cost=$0.97, ablation rate=100% → x=250, y=20 -->
    <circle cx="250" cy="20" r="8" fill="#b11f4b"/>
    <text x="270" y="15" font-size="9" font-weight="600" fill="#b11f4b">Full Squad</text>
    <text x="270" y="27" font-size="8" fill="#b11f4b">100% · $0.97</text>
    <text x="270" y="37" font-size="7" fill="#6f6f6f">(400-run: 99.75%)</text>

    <!-- Memory-only: cost=~$1.50 (estimated), rate=42.5%, σ=26.8% → x=332, y=174 -->
    <ellipse cx="332" cy="174" rx="30" ry="70" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,2"/>
    <circle cx="332" cy="174" r="7" fill="#f59e0b"/>
    <text x="355" y="169" font-size="9" font-weight="600" fill="#b45309">Memory-only</text>
    <text x="355" y="181" font-size="8" fill="#b45309">42.5% · ~$1.50*</text>

    <!-- Annotation arrow: "Coordination is cheap" -->
    <path d="M 200,54 C 190,48 178,44 172,42" fill="none" stroke="#5c5c5c" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow2)"/>
    <defs><marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5c5c5c"/></marker></defs>
    <text x="120" y="90" font-size="8" fill="#5c5c5c" font-style="italic">+7.5pp for −$0.27/task</text>

    <!-- Legend -->
    <circle cx="160" cy="340" r="5" fill="#b11f4b"/>
    <text x="170" y="344" font-size="9" fill="#5c5c5c">Full Squad</text>
    <circle cx="260" cy="340" r="5" fill="#b11f4b" opacity="0.65"/>
    <text x="270" y="344" font-size="9" fill="#5c5c5c">Coord-only</text>
    <circle cx="360" cy="340" r="5" fill="#f59e0b"/>
    <text x="370" y="344" font-size="9" fill="#5c5c5c">Memory-only</text>
    <circle cx="460" cy="340" r="5" fill="#0078d4"/>
    <text x="470" y="344" font-size="9" fill="#5c5c5c">No Squad</text>
    <text x="560" y="344" font-size="8" fill="#6f6f6f">Ellipse = ±1σ across domains</text>

    <text x="100" y="355" font-size="8" fill="#6f6f6f">* Memory-only cost estimated (not recorded in ablation). All other costs from actual token billing.</text>
  </svg>

