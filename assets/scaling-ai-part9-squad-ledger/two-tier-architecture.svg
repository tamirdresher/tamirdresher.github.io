<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="glow-green">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-blue">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="tier1-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a3a2a"/>
      <stop offset="100%" stop-color="#1a2e1a"/>
    </linearGradient>
    <linearGradient id="tier2-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a2a3e"/>
      <stop offset="100%" stop-color="#1a1a3e"/>
    </linearGradient>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7dff9a"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff6b6b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" fill="#1a1a2e" rx="12"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">The Two-Tier Squad State Architecture</text>

  <!-- ═══ TIER 1 ═══ -->
  <rect x="40" y="60" width="820" height="175" rx="10" fill="url(#tier1-grad)" stroke="#7dff9a" stroke-width="2" opacity="0.9"/>

  <!-- Tier 1 header -->
  <text x="60" y="88" fill="#7dff9a" font-size="16" font-weight="700" filter="url(#glow-green)">TIER 1</text>
  <text x="120" y="88" fill="#ffffff" font-size="16" font-weight="600">The Ledger</text>
  <text x="280" y="88" fill="#888ea8" font-size="13" font-style="italic">orphan branch: squad/state</text>

  <!-- Tier 1 boxes -->
  <rect x="60" y="105" width="145" height="50" rx="6" fill="#0d1f14" stroke="#7dff9a" stroke-width="1.5"/>
  <text x="132" y="127" text-anchor="middle" fill="#7dff9a" font-size="13" font-weight="600">team.md</text>
  <text x="132" y="145" text-anchor="middle" fill="#aaa" font-size="10">who's on the squad</text>

  <rect x="220" y="105" width="145" height="50" rx="6" fill="#0d1f14" stroke="#7dff9a" stroke-width="1.5"/>
  <text x="292" y="127" text-anchor="middle" fill="#7dff9a" font-size="13" font-weight="600">routing.md</text>
  <text x="292" y="145" text-anchor="middle" fill="#aaa" font-size="10">how work gets routed</text>

  <rect x="380" y="105" width="145" height="50" rx="6" fill="#0d1f14" stroke="#7dff9a" stroke-width="1.5"/>
  <text x="452" y="127" text-anchor="middle" fill="#7dff9a" font-size="13" font-weight="600">decisions.md</text>
  <text x="452" y="145" text-anchor="middle" fill="#aaa" font-size="10">universal decisions</text>

  <rect x="540" y="105" width="145" height="50" rx="6" fill="#0d1f14" stroke="#7dff9a" stroke-width="1.5"/>
  <text x="612" y="127" text-anchor="middle" fill="#7dff9a" font-size="13" font-weight="600">knowledge/</text>
  <text x="612" y="145" text-anchor="middle" fill="#aaa" font-size="10">accumulated research</text>

  <rect x="700" y="105" width="145" height="50" rx="6" fill="#0d1f14" stroke="#7dff9a" stroke-width="1.5"/>
  <text x="772" y="122" text-anchor="middle" fill="#7dff9a" font-size="13" font-weight="600">agents/*/</text>
  <text x="772" y="139" text-anchor="middle" fill="#7dff9a" font-size="13" font-weight="600">history.md</text>
  <text x="772" y="153" text-anchor="middle" fill="#aaa" font-size="10">agent memory</text>

  <!-- Tier 1 label -->
  <rect x="240" y="175" width="420" height="30" rx="15" fill="#7dff9a" opacity="0.15"/>
  <text x="450" y="195" text-anchor="middle" fill="#7dff9a" font-size="14" font-weight="700">🟢  Permanent — survives everything</text>

  <!-- Divider zone -->
  <line x1="80" y1="258" x2="820" y2="258" stroke="#333355" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- ═══ TIER 2 ═══ -->
  <rect x="40" y="280" width="820" height="155" rx="10" fill="url(#tier2-grad)" stroke="#4a9eed" stroke-width="2" opacity="0.9"/>

  <!-- Tier 2 header -->
  <text x="60" y="308" fill="#4a9eed" font-size="16" font-weight="700" filter="url(#glow-blue)">TIER 2</text>
  <text x="120" y="308" fill="#ffffff" font-size="16" font-weight="600">Git Notes</text>
  <text x="240" y="308" fill="#888ea8" font-size="13" font-style="italic">refs/notes/squad/*</text>

  <!-- Tier 2 boxes -->
  <rect x="80" y="325" width="200" height="50" rx="6" fill="#0d1420" stroke="#4a9eed" stroke-width="1.5"/>
  <text x="180" y="347" text-anchor="middle" fill="#4a9eed" font-size="13" font-weight="600">squad/decisions</text>
  <text x="180" y="365" text-anchor="middle" fill="#aaa" font-size="10">branch-scoped decisions</text>

  <rect x="310" y="325" width="200" height="50" rx="6" fill="#0d1420" stroke="#4a9eed" stroke-width="1.5"/>
  <text x="410" y="347" text-anchor="middle" fill="#4a9eed" font-size="13" font-weight="600">squad/reviews</text>
  <text x="410" y="365" text-anchor="middle" fill="#aaa" font-size="10">security reviews per commit</text>

  <rect x="540" y="325" width="200" height="50" rx="6" fill="#0d1420" stroke="#4a9eed" stroke-width="1.5"/>
  <text x="640" y="347" text-anchor="middle" fill="#4a9eed" font-size="13" font-weight="600">squad/context</text>
  <text x="640" y="365" text-anchor="middle" fill="#aaa" font-size="10">research context per feature</text>

  <!-- Tier 2 label -->
  <rect x="200" y="392" width="500" height="30" rx="15" fill="#4a9eed" opacity="0.15"/>
  <text x="450" y="412" text-anchor="middle" fill="#4a9eed" font-size="14" font-weight="700">🔵  Branch-scoped — follows commit lifecycle</text>

  <!-- ═══ ARROWS ═══ -->

  <!-- Promoted on merge: Tier 2 → Tier 1 -->
  <line x1="260" y1="280" x2="260" y2="235" stroke="#7dff9a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="270" y="247" width="170" height="22" rx="4" fill="#1a1a2e" opacity="0.9"/>
  <text x="355" y="263" text-anchor="middle" fill="#7dff9a" font-size="12" font-weight="600">✅ Promoted on merge</text>

  <!-- Unreachable on reject: Tier 2 → trash -->
  <line x1="640" y1="280" x2="640" y2="248" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>
  <!-- Trash icon (simplified) -->
  <rect x="628" y="235" width="24" height="20" rx="3" fill="none" stroke="#ff6b6b" stroke-width="1.5" opacity="0.7"/>
  <line x1="625" y1="238" x2="651" y2="238" stroke="#ff6b6b" stroke-width="1.5" opacity="0.7"/>
  <line x1="638" y1="233" x2="638" y2="238" stroke="#ff6b6b" stroke-width="1.5" opacity="0.7"/>
  <rect x="663" y="241" width="195" height="22" rx="4" fill="#1a1a2e" opacity="0.9"/>
  <text x="760" y="257" text-anchor="middle" fill="#ff6b6b" font-size="12" font-weight="600">❌ Unreachable on reject</text>

  <!-- Footer -->
  <text x="450" y="475" text-anchor="middle" fill="#666688" font-size="12" font-style="italic">Permanent state on a permanent branch. Scoped state on scoped commits.</text>
  <text x="450" y="498" text-anchor="middle" fill="#555577" font-size="11">Git's commit reachability IS the lifecycle engine — no application code required.</text>
</svg>
