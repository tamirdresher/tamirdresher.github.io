<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="timeline-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555577"/>
    </marker>
    <marker id="merge-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7dff9a"/>
    </marker>
    <marker id="reject-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ff6b6b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="460" fill="#1a1a2e" rx="12"/>

  <!-- Title -->
  <text x="460" y="36" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">Git Notes Lifecycle — How Branch-State Solves Itself</text>

  <!-- Timeline arrow -->
  <line x1="50" y1="75" x2="870" y2="75" stroke="#555577" stroke-width="2" marker-end="url(#timeline-arrow)"/>
  <text x="55" y="68" fill="#888ea8" font-size="11" font-weight="600">TIME →</text>

  <!-- ═══ COLUMN 1: Feature Branch ═══ -->
  <rect x="45" y="95" width="260" height="275" rx="10" fill="#12122a" stroke="#4a9eed" stroke-width="1.5"/>
  <text x="175" y="120" text-anchor="middle" fill="#4a9eed" font-size="15" font-weight="700">Feature Branch</text>
  <text x="175" y="138" text-anchor="middle" fill="#888ea8" font-size="11">feature/auth-middleware</text>

  <!-- Commit circle -->
  <circle cx="175" cy="195" r="28" fill="#0d1420" stroke="#4a9eed" stroke-width="2.5"/>
  <text x="175" y="192" text-anchor="middle" fill="#4a9eed" font-size="11" font-weight="700">commit</text>
  <text x="175" y="206" text-anchor="middle" fill="#4a9eed" font-size="10">a3f2c1d</text>

  <!-- Note attached to commit -->
  <rect x="108" y="245" width="134" height="55" rx="5" fill="#1a2a3e" stroke="#4a9eed" stroke-width="1.5" transform="rotate(-2, 175, 272)"/>
  <text x="175" y="265" text-anchor="middle" fill="#4a9eed" font-size="10" font-weight="600">📝 Git Note</text>
  <text x="175" y="280" text-anchor="middle" fill="#ddd" font-size="9">"Use JWT with RS256"</text>
  <text x="175" y="293" text-anchor="middle" fill="#aaa" font-size="9">— agent: data</text>

  <!-- Arrow: note → commit -->
  <line x1="175" y1="245" x2="175" y2="224" stroke="#4a9eed" stroke-width="1.5" stroke-dasharray="4,2"/>

  <text x="175" y="335" text-anchor="middle" fill="#4a9eed" font-size="12" font-weight="600">Note attached to commit</text>
  <text x="175" y="352" text-anchor="middle" fill="#888ea8" font-size="11">on feature branch</text>

  <!-- ═══ COLUMN 2: PR Merged ═══ -->
  <rect x="330" y="95" width="260" height="275" rx="10" fill="#0d1f14" stroke="#7dff9a" stroke-width="1.5"/>
  <text x="460" y="120" text-anchor="middle" fill="#7dff9a" font-size="15" font-weight="700">PR Merged ✅</text>
  <text x="460" y="138" text-anchor="middle" fill="#888ea8" font-size="11">commit lands in main</text>

  <!-- Main branch line -->
  <line x1="365" y1="175" x2="555" y2="175" stroke="#7dff9a" stroke-width="3" marker-end="url(#merge-arrow)"/>
  <text x="460" y="170" text-anchor="middle" fill="#7dff9a" font-size="10" font-weight="600">main</text>

  <!-- Commit circle (now on main) -->
  <circle cx="460" cy="210" r="28" fill="#0d1f14" stroke="#7dff9a" stroke-width="2.5"/>
  <text x="460" y="207" text-anchor="middle" fill="#7dff9a" font-size="11" font-weight="700">commit</text>
  <text x="460" y="221" text-anchor="middle" fill="#7dff9a" font-size="10">a3f2c1d</text>

  <!-- Merge arrow connecting to main -->
  <line x1="460" y1="175" x2="460" y2="182" stroke="#7dff9a" stroke-width="2"/>

  <!-- Note still attached -->
  <rect x="393" y="255" width="134" height="55" rx="5" fill="#1a3a2a" stroke="#7dff9a" stroke-width="1.5"/>
  <text x="460" y="275" text-anchor="middle" fill="#7dff9a" font-size="10" font-weight="600">📝 Git Note</text>
  <text x="460" y="290" text-anchor="middle" fill="#ddd" font-size="9">"Use JWT with RS256"</text>
  <text x="460" y="303" text-anchor="middle" fill="#aaa" font-size="9">✅ REACHABLE</text>

  <line x1="460" y1="255" x2="460" y2="239" stroke="#7dff9a" stroke-width="1.5" stroke-dasharray="4,2"/>

  <text x="460" y="335" text-anchor="middle" fill="#7dff9a" font-size="12" font-weight="700">Decision is permanent</text>
  <text x="460" y="352" text-anchor="middle" fill="#888ea8" font-size="11">reachable from main</text>

  <!-- ═══ COLUMN 3: PR Rejected ═══ -->
  <rect x="615" y="95" width="260" height="275" rx="10" fill="#1f0d0d" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="745" y="120" text-anchor="middle" fill="#ff6b6b" font-size="15" font-weight="700">PR Rejected ❌</text>
  <text x="745" y="138" text-anchor="middle" fill="#888ea8" font-size="11">branch deleted</text>

  <!-- Main branch line (no merge) -->
  <line x1="650" y1="175" x2="840" y2="175" stroke="#7dff9a" stroke-width="3" marker-end="url(#merge-arrow)"/>
  <text x="745" y="170" text-anchor="middle" fill="#7dff9a" font-size="10" font-weight="600">main</text>

  <!-- Orphaned commit (faded) -->
  <circle cx="745" cy="230" r="28" fill="#1f0d0d" stroke="#ff6b6b" stroke-width="2" opacity="0.4"/>
  <text x="745" y="227" text-anchor="middle" fill="#ff6b6b" font-size="11" font-weight="700" opacity="0.4">commit</text>
  <text x="745" y="241" text-anchor="middle" fill="#ff6b6b" font-size="10" opacity="0.4">a3f2c1d</text>

  <!-- No merge line (X mark) -->
  <line x1="730" y1="190" x2="760" y2="210" stroke="#ff6b6b" stroke-width="2" opacity="0.5"/>
  <line x1="760" y1="190" x2="730" y2="210" stroke="#ff6b6b" stroke-width="2" opacity="0.5"/>

  <!-- Note faded -->
  <rect x="678" y="270" width="134" height="55" rx="5" fill="#1f0d0d" stroke="#ff6b6b" stroke-width="1.5" opacity="0.3"/>
  <text x="745" y="290" text-anchor="middle" fill="#ff6b6b" font-size="10" font-weight="600" opacity="0.4">📝 Git Note</text>
  <text x="745" y="305" text-anchor="middle" fill="#ff6b6b" font-size="9" opacity="0.3">"Use JWT with RS256"</text>
  <text x="745" y="318" text-anchor="middle" fill="#ff6b6b" font-size="9" opacity="0.5">❌ UNREACHABLE</text>

  <line x1="745" y1="270" x2="745" y2="259" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.3"/>

  <text x="745" y="341" text-anchor="middle" fill="#ff6b6b" font-size="12" font-weight="700">Decision withdrawn</text>
  <text x="745" y="358" text-anchor="middle" fill="#888ea8" font-size="11">(automatically!)</text>

  <!-- ═══ ARROWS BETWEEN COLUMNS ═══ -->
  <line x1="305" y1="230" x2="328" y2="215" stroke="#555577" stroke-width="1.5" stroke-dasharray="6,3"/>
  <line x1="305" y1="230" x2="328" y2="245" stroke="#555577" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="317" y="205" text-anchor="middle" fill="#888ea8" font-size="10">OR</text>

  <line x1="590" y1="215" x2="613" y2="230" stroke="#555577" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- Footer banner -->
  <rect x="100" y="395" width="720" height="44" rx="8" fill="#12122a" stroke="#555577" stroke-width="1"/>
  <text x="460" y="415" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">No lifecycle code. No sync workflows. No sed.</text>
  <text x="460" y="433" text-anchor="middle" fill="#888ea8" font-size="12">Git's commit reachability handles it all.</text>
</svg>
