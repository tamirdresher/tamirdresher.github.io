<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Live Azure validation proof for Squad sandboxing sample</title>
  <desc id="desc">A sanitized validation card showing real Azure Container Apps Dynamic Sessions and Azure Container Apps Sandboxes runs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 700 48px "Segoe UI", Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 22px "Segoe UI", Arial, sans-serif; fill: #cbd5e1; }
      .section { font: 700 28px "Segoe UI", Arial, sans-serif; fill: #f8fafc; }
      .label { font: 600 18px "Segoe UI", Arial, sans-serif; fill: #93c5fd; text-transform: uppercase; letter-spacing: 0.08em; }
      .value { font: 500 23px "Cascadia Code", Consolas, monospace; fill: #e5e7eb; }
      .muted { font: 400 19px "Segoe UI", Arial, sans-serif; fill: #94a3b8; }
      .ok { fill: #22c55e; }
      .warn { fill: #f59e0b; }
      .card { fill: #0f172a; stroke: #334155; stroke-width: 1.5; filter: url(#shadow); }
      .pill { fill: #052e16; stroke: #22c55e; stroke-width: 1.5; }
      .code { font: 500 21px "Cascadia Code", Consolas, monospace; fill: #d1fae5; }
      .code2 { font: 500 21px "Cascadia Code", Consolas, monospace; fill: #bae6fd; }
      .redacted { font: 600 19px "Segoe UI", Arial, sans-serif; fill: #fef3c7; }
    </style>
  </defs>

  <rect width="1400" height="820" fill="url(#bg)"/>
  <circle cx="1200" cy="120" r="230" fill="#1d4ed8" opacity="0.16"/>
  <circle cx="160" cy="700" r="260" fill="#7c3aed" opacity="0.13"/>

  <rect x="70" y="60" width="1260" height="110" rx="26" fill="#020617" stroke="#1e293b"/>
  <rect x="95" y="85" width="178" height="46" rx="23" class="pill"/>
  <circle cx="123" cy="108" r="8" class="ok"/>
  <text x="143" y="116" class="muted" fill="#bbf7d0">LIVE AZURE</text>
  <text x="95" y="215" class="title">Squad sandboxing sample: real Azure run</text>
  <text x="95" y="254" class="subtitle">Dynamic Sessions executed the worker. ACA Sandboxes executed a real Ubuntu sandbox. Secrets and session IDs stay out of the picture.</text>

  <g transform="translate(80 305)">
    <rect width="600" height="390" rx="24" class="card"/>
    <rect x="24" y="24" width="210" height="40" rx="20" fill="#082f49" stroke="#38bdf8"/>
    <text x="46" y="51" class="muted" fill="#bae6fd">Dynamic Sessions</text>
    <text x="28" y="105" class="section">Custom container session pool</text>
    <text x="28" y="150" class="label">Pool</text>
    <text x="28" y="180" class="value">sp-ds-val-94663</text>
    <text x="28" y="225" class="label">Network</text>
    <text x="28" y="255" class="value">EgressDisabled</text>
    <text x="28" y="300" class="label">Worker result</text>
    <text x="28" y="330" class="value">artifact-f6c0427e · risk 96/100</text>
    <text x="28" y="365" class="muted">Runtime: worker · session identifier redacted</text>
  </g>

  <g transform="translate(720 305)">
    <rect width="600" height="390" rx="24" class="card"/>
    <rect x="24" y="24" width="170" height="40" rx="20" fill="#312e81" stroke="#a78bfa"/>
    <text x="46" y="51" class="muted" fill="#ddd6fe">ACA Sandboxes</text>
    <text x="28" y="105" class="section">Preview sandbox group</text>
    <text x="28" y="150" class="label">Sandbox group</text>
    <text x="28" y="180" class="value">sbg-val-94663</text>
    <text x="28" y="225" class="label">Visible sandbox</text>
    <text x="28" y="255" class="value">Running · auto-suspend 300s</text>
    <text x="28" y="300" class="label">Exec output</text>
    <text x="28" y="330" class="value">visible-aca-sandbox</text>
    <text x="28" y="365" class="muted">Ubuntu sandbox returned exit code 0</text>
  </g>

  <g transform="translate(95 727)">
    <rect width="1210" height="52" rx="16" fill="#020617" stroke="#1e293b"/>
    <text x="22" y="34" class="code2">npm run demo -- --azure</text>
    <text x="355" y="34" class="code">Mode: azure · Artifact: artifact-f6c0427e · Findings: latency:2, reliability:1, adoption:2</text>
    <text x="1080" y="34" class="redacted">&lt;redacted&gt;</text>
  </g>

  <rect x="70" y="282" width="1260" height="3" fill="url(#accent)"/>
</svg>
