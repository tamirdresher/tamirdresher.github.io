<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="260" viewBox="0 0 1500 260" role="img" aria-labelledby="title desc">
  <title id="title">TL;DR architecture for running Squad inside LangGraph</title>
  <desc id="desc">LangGraph flows to reviewerAgent, applyApprovedStackFixes, squadTechDesign, Copilot SDK, squad, .squad/*, and DispatchRecord.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <style>
      .label { font: 700 16px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 12px "Segoe UI", Arial, sans-serif; fill: #475569; }
      .caption { font: 600 16px "Segoe UI", Arial, sans-serif; fill: #cbd5e1; }
      .arrow { stroke: #38bdf8; stroke-width: 4; fill: none; marker-end: url(#arrow); stroke-linecap: round; }
      .box { fill: url(#node); stroke: #bae6fd; stroke-width: 2; filter: url(#shadow); }
      .code { fill: #eef2ff; stroke: #818cf8; }
      .sdk { fill: #ecfeff; stroke: #22d3ee; }
      .squad { fill: #fef3c7; stroke: #f59e0b; }
      .record { fill: #dcfce7; stroke: #22c55e; }
    </style>
  </defs>
  <rect width="1500" height="260" rx="26" fill="url(#bg)"/>
  <text x="40" y="48" class="caption">Deterministic graph, one Squad boundary, structured result</text>

  <rect class="box" x="40" y="92" width="135" height="78" rx="16"/>
  <text x="107.5" y="123" text-anchor="middle" class="label">LangGraph</text>
  <text x="107.5" y="147" text-anchor="middle" class="small">owns flow</text>

  <path class="arrow" d="M 181 131 H 206"/>
  <rect class="box" x="214" y="92" width="150" height="78" rx="16"/>
  <text x="289" y="123" text-anchor="middle" class="label">reviewerAgent</text>
  <text x="289" y="147" text-anchor="middle" class="small">visible review</text>

  <path class="arrow" d="M 370 131 H 395"/>
  <rect class="box code" x="403" y="92" width="190" height="78" rx="16"/>
  <text x="498" y="119" text-anchor="middle" class="label">applyApproved</text>
  <text x="498" y="141" text-anchor="middle" class="label">StackFixes</text>
  <text x="498" y="160" text-anchor="middle" class="small">plain TypeScript</text>

  <path class="arrow" d="M 599 131 H 624"/>
  <rect class="box" x="632" y="92" width="155" height="78" rx="16"/>
  <text x="709.5" y="119" text-anchor="middle" class="label">squadTech</text>
  <text x="709.5" y="141" text-anchor="middle" class="label">Design</text>

  <path class="arrow" d="M 793 131 H 818"/>
  <rect class="box sdk" x="826" y="92" width="145" height="78" rx="16"/>
  <text x="898.5" y="123" text-anchor="middle" class="label">Copilot SDK</text>
  <text x="898.5" y="147" text-anchor="middle" class="small">one entry point</text>

  <path class="arrow" d="M 977 131 H 1002"/>
  <rect class="box squad" x="1010" y="92" width="125" height="78" rx="16"/>
  <text x="1072.5" y="123" text-anchor="middle" class="label">squad</text>
  <text x="1072.5" y="147" text-anchor="middle" class="small">custom agent</text>

  <path class="arrow" d="M 1141 131 H 1166"/>
  <rect class="box squad" x="1174" y="92" width="130" height="78" rx="16"/>
  <text x="1239" y="123" text-anchor="middle" class="label">.squad/*</text>
  <text x="1239" y="147" text-anchor="middle" class="small">repo-local team</text>

  <path class="arrow" d="M 1310 131 H 1335"/>
  <rect class="box record" x="1343" y="92" width="145" height="78" rx="16"/>
  <text x="1415.5" y="123" text-anchor="middle" class="label">Dispatch</text>
  <text x="1415.5" y="145" text-anchor="middle" class="label">Record</text>

  <text x="750" y="226" text-anchor="middle" class="caption">The app sees named nodes and one result. Squad's internal team context stays behind the SDK boundary.</text>
</svg>
