<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 630">
  <title id="title">Squad inside a LangGraph workflow</title>
  <desc id="desc">A public-safe developer diagram showing LangGraph running a standalone reviewer, deterministic TypeScript fixes, and one squad SDK custom agent with scoped tools.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#38bdf8"/>
    </marker>
    <style>
      .title { font: 700 44px "Segoe UI", Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 500 21px "Segoe UI", Arial, sans-serif; fill: #cbd5e1; }
      .label { font: 700 22px "Segoe UI", Arial, sans-serif; fill: #f8fafc; }
      .small { font: 600 17px "Segoe UI", Arial, sans-serif; fill: #cbd5e1; }
      .tiny { font: 600 14px "Segoe UI", Arial, sans-serif; fill: #94a3b8; }
      .node { fill: #172033; stroke: #38bdf8; stroke-width: 2.2; }
      .squad { fill: #2d1f46; stroke: #c084fc; stroke-width: 2.2; }
      .tool { fill: #11291f; stroke: #34d399; stroke-width: 2; }
      .seam { fill: #422006; stroke: #fbbf24; stroke-width: 2.2; }
      .line { stroke: #38bdf8; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .mutedLine { stroke: #64748b; stroke-width: 2.2; fill: none; stroke-dasharray: 7 8; }
    </style>
  </defs>

  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1030" cy="88" r="180" fill="#38bdf8" opacity="0.09"/>
  <circle cx="142" cy="540" r="210" fill="#c084fc" opacity="0.08"/>

  <text x="70" y="80" class="title">Squad inside LangGraph</text>
  <text x="72" y="116" class="subtitle">Deterministic Node.js workflow, narrow delegation seam, scoped tools</text>

  <g filter="url(#shadow)">
    <rect x="68" y="164" width="1064" height="150" rx="26" fill="url(#panel)" stroke="#334155" stroke-width="2"/>
    <text x="96" y="205" class="label">LangGraph</text>
    <text x="96" y="232" class="tiny">code owns order, retries, and state</text>

    <rect x="220" y="202" width="128" height="58" rx="16" class="node"/>
    <text x="249" y="237" class="small">intake</text>

    <rect x="388" y="202" width="150" height="58" rx="16" class="node"/>
    <text x="414" y="237" class="small">review</text>

    <rect x="578" y="202" width="144" height="58" rx="16" class="node"/>
    <text x="599" y="237" class="small">auto-fix</text>

    <rect x="762" y="202" width="132" height="58" rx="16" class="node"/>
    <text x="790" y="237" class="small">design</text>

    <rect x="934" y="202" width="142" height="58" rx="16" class="node"/>
    <text x="963" y="237" class="small">assemble</text>

    <path d="M348 231 L388 231" class="line"/>
    <path d="M538 231 L578 231" class="line"/>
    <path d="M722 231 L762 231" class="line"/>
    <path d="M894 231 L934 231" class="line"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="348" y="346" width="230" height="74" rx="20" class="seam"/>
    <text x="379" y="379" class="label">runReviewerAgent</text>
    <text x="387" y="404" class="tiny">standalone review seam</text>

    <rect x="724" y="346" width="230" height="74" rx="20" class="seam"/>
    <text x="755" y="379" class="label">runSquadTechDesign</text>
    <text x="766" y="404" class="tiny">squad design seam</text>
  </g>

  <path d="M463 260 L463 346" class="line"/>
  <path d="M828 260 L839 346" class="line"/>
  <path d="M954 383 C1016 372 1048 318 1005 260" class="mutedLine"/>

  <g filter="url(#shadow)">
    <rect x="80" y="470" width="284" height="88" rx="22" class="squad"/>
    <text x="112" y="504" class="label">Standalone reviewer</text>
    <text x="112" y="532" class="tiny">tool: recordFinding</text>

    <rect x="458" y="470" width="284" height="88" rx="22" class="squad"/>
    <text x="498" y="504" class="label">TypeScript fix-up</text>
    <text x="498" y="532" class="tiny">no model call</text>

    <rect x="836" y="470" width="284" height="88" rx="22" class="squad"/>
    <text x="888" y="504" class="label">Squad coordinator</text>
    <text x="888" y="532" class="tiny">tools: stack + draftSection</text>
  </g>

  <path d="M405 420 C338 442 298 450 245 470" class="line"/>
  <path d="M520 420 C562 444 584 450 600 470" class="line"/>
  <path d="M839 420 C860 442 884 454 930 470" class="line"/>

  <g filter="url(#shadow)">
    <rect x="986" y="346" width="146" height="74" rx="20" class="tool"/>
    <text x="1024" y="378" class="label">tools</text>
    <text x="1012" y="404" class="tiny">per member</text>
  </g>
</svg>
