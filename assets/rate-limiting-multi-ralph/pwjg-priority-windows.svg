<svg xmlns="http://www.w3.org/2000/svg" width="700" height="220" viewBox="0 0 700 220">
<rect width="700" height="220" fill="#f8f9fa"/>
<text x="350" y="30" text-anchor="middle" fill="#1a1a2e" font-family="Arial" font-size="16" font-weight="bold">PWJG Priority Retry Windows</text>
<rect x="50" y="70" width="180" height="40" rx="4" fill="#e94560" opacity="0.85"/>
<text x="140" y="95" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">P0 Critical</text>
<rect x="240" y="70" width="180" height="40" rx="4" fill="#f39c12" opacity="0.85"/>
<text x="330" y="95" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">P1 Standard</text>
<rect x="430" y="70" width="220" height="40" rx="4" fill="#27ae60" opacity="0.85"/>
<text x="540" y="95" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">P2 Background</text>
<text x="140" y="135" text-anchor="middle" fill="#e94560" font-family="Arial" font-size="10">0-30% of window</text>
<text x="330" y="135" text-anchor="middle" fill="#f39c12" font-family="Arial" font-size="10">30-60% of window</text>
<text x="540" y="135" text-anchor="middle" fill="#27ae60" font-family="Arial" font-size="10">60-100% of window</text>
<text x="140" y="150" text-anchor="middle" fill="#888" font-family="Arial" font-size="9">Immediate retry</text>
<text x="330" y="150" text-anchor="middle" fill="#888" font-family="Arial" font-size="9">Delayed retry</text>
<text x="540" y="150" text-anchor="middle" fill="#888" font-family="Arial" font-size="9">Best-effort</text>
<text x="350" y="190" text-anchor="middle" fill="#555" font-family="Arial" font-size="11">Non-overlapping bands ensure critical agents retry first</text>
</svg>
