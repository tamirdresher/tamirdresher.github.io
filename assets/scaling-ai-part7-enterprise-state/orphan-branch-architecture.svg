<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <defs>
    <style>
      .title { font: bold 20px sans-serif; fill: #e0e0e0; }
      .label { font: 14px sans-serif; fill: #d0d0d0; }
      .small { font: 12px monospace; fill: #a0a0a0; }
      .cmd { font: 12px monospace; fill: #4cda6a; }
      .code-branch { fill: #2a6db5; stroke: #4a9eed; stroke-width: 2; }
      .state-branch { fill: #1e8a3e; stroke: #3dba5e; stroke-width: 2; }
      .worktree { fill: #b86315; stroke: #e89035; stroke-width: 2; }
      .arrow { stroke: #808080; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-green { stroke: #3dba5e; stroke-width: 2; fill: none; marker-end: url(#arrowhead-green); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#808080" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#3dba5e" />
    </marker>
  </defs>

  <!-- Dark Background -->
  <rect width="900" height="600" fill="#1a1a2e" rx="8"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" class="title">Orphan Branch Architecture</text>
  <text x="450" y="55" text-anchor="middle" class="small">Code branches separate from squad state — no PR conflicts</text>

  <!-- Left Side: Code Branches -->
  <g id="code-branches">
    <text x="100" y="100" class="label" font-weight="bold">Code Branches (Protected)</text>
    
    <!-- Main branch -->
    <rect x="50" y="120" width="250" height="50" class="code-branch" rx="6"/>
    <text x="175" y="150" text-anchor="middle" class="label" fill="white" font-weight="bold">main</text>
    
    <!-- Feature branches -->
    <rect x="50" y="190" width="250" height="45" class="code-branch" rx="6"/>
    <text x="175" y="217" text-anchor="middle" class="small" fill="white">feature/auth-middleware</text>
    
    <rect x="50" y="250" width="250" height="45" class="code-branch" rx="6"/>
    <text x="175" y="277" text-anchor="middle" class="small" fill="white">feature/api-endpoints</text>
    
    <rect x="50" y="310" width="250" height="45" class="code-branch" rx="6"/>
    <text x="175" y="337" text-anchor="middle" class="small" fill="white">bugfix/token-expiry</text>
    
    <!-- Branch protection badge -->
    <rect x="80" y="370" width="190" height="30" fill="#e74c3c" rx="4"/>
    <text x="175" y="390" text-anchor="middle" class="small" fill="white" font-weight="bold">🔒 Requires PR approval</text>
  </g>

  <!-- Right Side: State Orphan Branch -->
  <g id="state-branch">
    <text x="650" y="100" class="label" font-weight="bold">State Orphan Branch (Unprotected)</text>
    
    <!-- Orphan branch -->
    <rect x="550" y="120" width="300" height="280" class="state-branch" rx="6"/>
    <text x="700" y="150" text-anchor="middle" class="label" fill="white" font-weight="bold">squad/state</text>
    <text x="700" y="175" text-anchor="middle" class="small" fill="white">(orphan — no parent commits)</text>
    
    <!-- State files inside -->
    <text x="570" y="210" class="small" fill="white">• .squad/decisions.md</text>
    <text x="570" y="235" class="small" fill="white">• .squad/schedule-state.json</text>
    <text x="570" y="260" class="small" fill="white">• .squad/agents/*/history.md</text>
    <text x="570" y="285" class="small" fill="white">• .squad/ralph/work-log.json</text>
    <text x="570" y="310" class="small" fill="white">• .squad/ceremonies/*/</text>
    
    <!-- No protection badge -->
    <rect x="580" y="340" width="240" height="40" fill="#27ae60" rx="4"/>
    <text x="700" y="365" text-anchor="middle" class="small" fill="white" font-weight="bold">✓ Agents push directly (no PR)</text>
  </g>

  <!-- Git Worktree Connection -->
  <g id="worktree">
    <text x="450" y="450" text-anchor="middle" class="label" font-weight="bold">Git Worktree Mount</text>
    
    <rect x="300" y="465" width="300" height="60" class="worktree" rx="6"/>
    <text x="450" y="490" text-anchor="middle" class="cmd">git worktree add .squad squad/state</text>
    <text x="450" y="510" text-anchor="middle" class="small">Mounts squad/state branch into .squad/ directory</text>
  </g>

  <!-- Arrows showing connection -->
  <path d="M 175 370 L 175 430 L 300 465" class="arrow" stroke-dasharray="5,5"/>
  <path d="M 700 400 L 700 430 L 600 465" class="arrow-green" stroke-dasharray="5,5"/>
  
  <!-- Bottom explanation -->
  <text x="450" y="560" text-anchor="middle" class="label" fill="#3dba5e" font-weight="bold">
    .squad/ stays on squad/state branch when switching code branches
  </text>
  <text x="450" y="585" text-anchor="middle" class="small" fill="#808080">
    Agents write state directly. Code PRs see zero .squad/ files.
  </text>
</svg>
