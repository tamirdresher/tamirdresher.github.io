<footer class="d-flex w-100 justify-content-center flex-column align-items-center">

  <!-- Newsletter signup CTA — replace # with actual newsletter signup URL (e.g., ConvertKit, Substack) -->
  <div class="newsletter-cta text-center mb-3 p-3" style="max-width: 600px; width: 100%;">
    <p class="mb-1"><strong>📬 Subscribe to my newsletter</strong></p>
    <p class="mb-2" style="font-size: 0.9em;">Get AI, .NET, and distributed systems insights delivered to your inbox.</p>
    <a href="#" class="btn btn-sm btn-outline-primary">Subscribe</a>
    <!-- TODO: Replace href="#" with actual newsletter signup link (ConvertKit, Substack, etc.) -->
  </div>

  <div class="d-flex justify-content-between align-items-center">
    <div class="footer-left">
      <p class="mb-0">
        © {{ 'now' | date: "%Y" }}
        <a href="{{ site.social.links[0] }}">{{ site.social.name }}</a>.
        {% if site.data.rights.brief %}
        <span data-toggle="tooltip" data-placement="top"
          title="{{ site.data.rights.verbose }}">{{ site.data.rights.brief }}</span>
        {% endif %}
      </p>
    </div>

    <div class="footer-right">
      <p class="mb-0">
        <a href="/tabs/affiliate-disclosure/">Affiliate Disclosure</a> |
        Powered by
        <a href="https://jekyllrb.com" target="_blank">Jekyll</a>
        with
        <a href="https://github.com/cotes2020/jekyll-theme-chirpy/">Chirpy</a>
        theme.
      </p>
    </div>

  </div> <!-- div.d-flex -->
</footer>
